<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#181d27" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />
  <g transform="translate(106, 80)">
    <!-- Shield Outline -->
    <path d="M150 20 L270 65 C270 210, 185 305, 150 340 C115 305, 30 210, 30 65 Z" fill="url(#emerald)" filter="url(#glow)" opacity="0.95" />
    <path d="M150 35 L255 75 C255 200, 180 285, 150 318 C120 285, 45 200, 45 75 Z" fill="#0c0e14" opacity="0.45" />
    <!-- Checkmark -->
    <path d="M105 175 L135 205 L200 135" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
